# Conda environment for deepFRI2 inference on CPU (no GPU required).
#
#     conda env create -f environment-cpu.yml
#     conda activate deepfri2_cpu
#
name: deepfri2_cpu
channels:
  - conda-forge
dependencies:
  - python=3.12.8
  - pytorch=2.5.1=cpu*
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.14.1
  - transformers=4.48.0
  - huggingface_hub=0.27.1
  - tokenizers=0.21.0
  - safetensors=0.5.2
  - biopython=1.85
  - tqdm=4.67.1
  - matplotlib-base=3.9.2
  - pip
  - pip:
      - fastobo==0.12.3
