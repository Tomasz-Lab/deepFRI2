# Conda environment for deepFRI2 inference on GPU (recommended).
#
# Requires an NVIDIA GPU with a driver supporting CUDA 12.6.
# For CPU-only machines, use environment-cpu.yml instead.
#
#     conda env create -f environment-gpu.yml
#     conda activate deepfri2
name: deepfri2
channels:
  - conda-forge
dependencies:
  - python=3.12.8
  # Validated PyTorch build; looser cuda126* pins may resolve to a newer build
  # which may cause slightly different probabilities outputed from the model
  - pytorch=2.5.1=cuda126_py312h1763f6d_306
  - cuda-version=12.6
  - cudnn=9.3.*
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.14.1
  - transformers=4.48.0
  - huggingface_hub=0.27.1
  - tokenizers=0.21.0
  - safetensors=0.5.2
  - biopython=1.85
  - tqdm=4.67.1
  - pip
  - pip:
      - fastobo==0.12.3
